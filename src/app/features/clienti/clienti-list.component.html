<div class="page">
  <div class="page-header">
    <h1>👥 Clienti</h1>
    <button class="btn btn-primary" (click)="create()">+ Nuovo</button>
  </div>
  <div class="card">
    <div class="search-bar">
      <input type="text" placeholder="Cerca per codice, ragione sociale, nome, email..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" class="search-input" />
    </div>
    <div *ngIf="loading" class="loading">⏳ Caricamento...</div>
    <div *ngIf="error" class="error-block">⚠️ {{ error }}</div>
    <div *ngIf="!loading && !error">
      <div *ngIf="filtered.length === 0" class="empty-state">Nessun cliente trovato.</div>
      <table *ngIf="filtered.length > 0" class="data-table">
        <thead>
          <tr>
            <th>Codice</th>
            <th>Ragione Sociale</th>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Telefono</th>
            <th>Email</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of paginatedItems">
            <td>{{ item.codice }}</td>
            <td>{{ item.ragioneSociale }}</td>
            <td>{{ item.nome }}</td>
            <td>{{ item.cognome }}</td>
            <td>{{ item.telefono }}</td>
            <td>{{ item.email }}</td>
            <td class="actions">
              <button class="btn btn-sm btn-secondary" (click)="edit(item)">✏️ Modifica</button>
              <button class="btn btn-sm btn-danger" (click)="deleteItem(item)">🗑️ Elimina</button>
            </td>
          </tr>
        </tbody>
      </table>
      <app-pagination
        [totalItems]="filtered.length"
        [page]="currentPage"
        [pageSize]="pageSize"
        label="clienti"
        (pageChange)="goToPage($event)"
        (pageSizeChange)="changePageSize($event)">
      </app-pagination>
    </div>
  </div>
</div>
