<div class="page">
  <div class="page-header">
    <h1>{{ isNew ? '+ Nuova Attrezzatura' : '✏️ Modifica Attrezzatura' }}</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" (click)="goBack()">← Indietro</button>
      <button appAdmin *ngIf="!isNew" class="btn btn-danger" (click)="deleteItem()">🗑️ Elimina</button>
    </div>
  </div>

  <div class="card">
    <div *ngIf="loading" class="loading">⏳ Caricamento...</div>
    <div *ngIf="error" class="error-block">⚠️ {{ error }}</div>

    <form *ngIf="!loading" (ngSubmit)="save()"><fieldset class="lock" [disabled]="!auth.isAdmin()">
      <div class="form-grid">
        <div class="form-group">
          <label>Matricola</label>
          <input type="text" [(ngModel)]="form.matricola" name="matricola" class="form-control" placeholder="Matricola" />
        </div>
        <div class="form-group">
          <label>Descrizione</label>
          <input type="text" [(ngModel)]="form.descrizione" name="descrizione" class="form-control" placeholder="Descrizione" />
        </div>
        <div class="form-group">
          <label>Marca</label>
          <input type="text" [(ngModel)]="form.marca" name="marca" class="form-control" placeholder="Marca" />
        </div>
        <div class="form-group">
          <label>Modello</label>
          <input type="text" [(ngModel)]="form.modello" name="modello" class="form-control" placeholder="Modello" />
        </div>
        <div class="form-group">
          <label>Stato</label>
          <select [(ngModel)]="form.stato" name="stato" class="form-control">
            <option *ngFor="let s of statiOptions" [value]="s.value">{{ s.label }}</option>
          </select>
        </div>
        <div class="form-group wide">
          <label>Articolo del catalogo</label>
          <app-select-ricerca *ngIf="!creaArticolo" [opzioni]="opzioniArticoli" voceVuota="Nessun articolo collegato"
            placeholder="Cerca per codice o descrizione…" [(ngModel)]="form.articoloId" (ngModelChange)="onArticoloChange($event)" name="articoloId"></app-select-ricerca>
          <ng-container *ngIf="creaArticolo">
            <input type="text" [(ngModel)]="codiceArticolo" name="codiceArticolo" class="form-control" maxlength="50" placeholder="Codice del nuovo articolo">
            <small class="hint">Il nuovo articolo avrà la descrizione indicata sopra.</small>
          </ng-container>
          <label *ngIf="!form.articoloId || creaArticolo" class="check">
            <input type="checkbox" [(ngModel)]="creaArticolo" name="creaArticolo"> Crea un nuovo articolo a catalogo per questa matricola
          </label>
          <small class="hint">Collegandolo, la matricola e il suo articolo si trovano insieme quando la metti in noleggio.</small>
        </div>
      </div>
      </fieldset><div class="form-actions">
        <button appAdmin type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Salvataggio...' : '💾 Salva' }}
        </button>
      </div>
    </form>
  </div>
</div>
